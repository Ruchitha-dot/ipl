
<!DOCTYPE html>
<html>
<head>
    <title>IPL Ticket Booking</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f2f2f2;
            margin: 0;
            padding: 20px;
        }

        .container {
            width: 400px;
            margin: auto;
            background: white;
            padding: 25px;
            border-radius: 10px;
        }

        h2 {
            text-align: center;
            color: #e65100;
        }

        label {
            display: block;
            margin-top: 12px;
        }

        input, select {
            width: 100%;
            padding: 9px;
            margin-top: 5px;
            box-sizing: border-box;
        }

        button {
            padding: 10px 20px;
            margin-top: 18px;
            cursor: pointer;
        }

        .submit {
            background: green;
            color: white;
            border: none;
        }

        .reset {
            background: #ddd;
            border: none;
        }
    </style>
</head>

<body>

<div class="container">

    <h2>IPL Ticket Booking</h2>

    <form action="#" method="get">

        <label>Full Name:</label>
        <input type="text" name="name"
        placeholder="Enter your name"
        minlength="3" maxlength="30" required>

        <label>Email:</label>
        <input type="email" name="email"
        placeholder="Enter your email" required>

        <label>Phone Number:</label>
        <input type="tel" name="phone"
        placeholder="Enter 10 digit number"
        pattern="[0-9]{10}"
        maxlength="10" required>

        <label>Select Match:</label>
        <select name="match" required>
            <option value="">--Select Match--</option>
            <option>RCB vs CSK</option>
            <option>MI vs KKR</option>
            <option>RCB vs MI</option>
            <option>CSK vs SRH</option>
        </select>

        <label>Stand Category:</label>
        <select name="stand" required>
            <option value="">--Select Stand--</option>
            <option>General Stand</option>
            <option>Premium Stand</option>
            <option>VIP Stand</option>
        </select>

        <label>Number of Tickets:</label>
        <input type="number" name="tickets"
        min="1" max="10" required>

        <label>Booking Preference:</label>
        <input type="radio" name="preference"
        value="Online" required> Online Booking

        <input type="radio" name="preference"
        value="Counter"> Counter Booking

        <br><br>

        <button type="submit" class="submit">
            Submit
        </button>

        <button type="reset" class="reset">
            Reset
        </button>

    </form>

    <br>
    <a href="index.html">Back to Home</a>

</div>

</body>
</html>
